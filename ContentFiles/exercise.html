<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129496;</text></svg>">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="runner-page">
        <div class="section">
            <div class="runner-header">
                <h2>EXERCISE</h2>
                <div class="streak">
                    <span class="streak-trophy">&#127947;</span>
                    <span class="streak-label">Consistency Builds Strength</span>
                </div>
            </div>
            <!-- <p>[Aug: 2][July: 7][June: 13][May: 3][April: 8.5]</p> -->
        </div>

        <div class="section">
            <div class="exercise-tabs" id="exerciseTabs" role="tablist" aria-label="Exercise plans"></div>
            <div class="exercise-container" id="exercisePanel" role="tabpanel" tabindex="0">
                <ul class="exercise-list" id="exerciseItems"></ul>
            </div>
        </div>
    </div>

    <script src="../data.js"></script>
    <script src="../script.js"></script>
    <script>
        const dayPlans = [

            {
                type: "PULL",
                items: [
                    "One-arm Dumbbell Rows (4 kg) - 3 x 15",
                    "Dumbbell Pullovers (4 kg) - 3 x 20",
                    "Bicep Curl (4 kg) - 3 x 15",
                    "Hammer Curl (4 kg) - 3 x 15",
                    "Rear Delt Raises (2 kg) - 3 x 15",
                    "Farmer's Carry (4 kg) - 3 rounds x 3 min"
                ]
            },
            {
                type: "SURYA NAMASKAR",
                items: [
                    "Surya Namaskar x 10",
                    "8-minute leg-raise jumping",
                    "Deep stretching for hips, back, hamstrings"
                ]
            },
            {
                type: "PUSH+CORE",
                items: [
                    "Floor Dumbbell Press(4 kg) - 20, 15 x 3",
                    "Shoulder Press (4 kg) - 10 x 3",
                    "Lateral Raises (2 kg) - 15 x 3",
                    "Tricep Extensions (4 kg) - 20, 15 x 3",
                    "Leg Raise - 15 x 3"
                ]
            },
            {
                type: "UPPER/LIGHT FULL BODY",
                items: [
                    "Bent-over Row (4 kg) - 15 x 3",
                    "Shoulder Press (2 kg) - 15 x 3",
                    "Crunches & Bicycle - 15 x 3"
                ]
            },
            {
                type: "LEGS + GLUTES + CORE",
                items: [
                    "Goblet Squat (4 kg) - 3 x 15",
                    "Dumbbell Lunges(2 kg) - 3 x 7 each leg",
                    "Bulgarian Split Squat - 3 x 10 each leg",
                    "Dumbbell Romanian Deadlift - 4 x 12",
                    "Glute Bridges with Dumbbells - 4 x 20",
                    "Calf Raises - 3 x 25",
                    "Side-Lying Hip Abductions - 15-10-10 each side"
                ]
            },
            {
                type: "REST",
                items: [
                    "8-minute leg-raise jumping"
                ]
            },
            {
                type: "FULL CARDIO",
                items: [
                    "High Knees - 2 min",
                    "8-minute leg-raise jumping",
                    "Mountain Climbers - 3 x 40 sec",
                    "Slow Stretching - 5 min"
                ]
            }
        ];

        let currentDayIndex = 0;

        const exerciseTabsEl = document.getElementById("exerciseTabs");
        const exercisePanelEl = document.getElementById("exercisePanel");
        const exerciseItemsEl = document.getElementById("exerciseItems");

        dayPlans.forEach((plan, index) => {
            const tab = document.createElement("button");
            tab.type = "button";
            tab.className = "exercise-tab";
            tab.id = `exercise-tab-${index}`;
            tab.textContent = plan.type;
            tab.setAttribute("role", "tab");
            tab.setAttribute("aria-controls", "exercisePanel");
            tab.addEventListener("click", () => {
                currentDayIndex = index;
                renderDayAgenda();
            });
            tab.addEventListener("keydown", (event) => {
                let nextIndex = index;
                if (event.key === "ArrowRight") nextIndex = (index + 1) % dayPlans.length;
                else if (event.key === "ArrowLeft") nextIndex = (index - 1 + dayPlans.length) % dayPlans.length;
                else if (event.key === "Home") nextIndex = 0;
                else if (event.key === "End") nextIndex = dayPlans.length - 1;
                else return;

                event.preventDefault();
                currentDayIndex = nextIndex;
                renderDayAgenda();
                exerciseTabsEl.children[nextIndex].focus();
            });
            exerciseTabsEl.appendChild(tab);
        });

        function renderDayAgenda() {
            const currentPlan = dayPlans[currentDayIndex];
            Array.from(exerciseTabsEl.children).forEach((tab, index) => {
                const isActive = index === currentDayIndex;
                tab.setAttribute("aria-selected", String(isActive));
                tab.tabIndex = isActive ? 0 : -1;
            });
            exercisePanelEl.setAttribute("aria-labelledby", `exercise-tab-${currentDayIndex}`);

            exerciseItemsEl.innerHTML = "";
            currentPlan.items.forEach((item) => {
                const listItem = document.createElement("li");
                listItem.textContent = item;
                listItem.addEventListener("click", function () {
                    // Toggle selection: remove from others, toggle on this one
                    const allItems = exerciseItemsEl.querySelectorAll("li");
                    allItems.forEach(li => {
                        if (li !== this) {
                            li.classList.remove("selected");
                        }
                    });
                    this.classList.toggle("selected");
                });
                exerciseItemsEl.appendChild(listItem);
            });
        }

        renderDayAgenda();

        const streakDaysEl = document.getElementById("streakDays");
        const lastRunEl = document.getElementById("lastRun");

        if (streakDaysEl && typeof RUNNER_DATA !== "undefined") {
            streakDaysEl.textContent = RUNNER_DATA.streakDays;
        }

        if (lastRunEl && typeof RUNNER_DATA !== "undefined") {
            lastRunEl.textContent = RUNNER_DATA.lastRun;
        }
    </script>

</body>

</html>
